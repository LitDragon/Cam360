name: Build Fix Agent

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run diagnostic build/test and report only"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      focus:
        description: "Optional build-fix focus"
        required: false
        default: ""
      max_files:
        description: "Maximum files the agent may edit"
        required: true
        default: "3"
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  build-fix:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event == 'push' &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.head_branch == 'master'
          )
        )
      }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve simulator destination
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          echo "SIMULATOR_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run build fix agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_MODE: ${{ vars.OPENAI_API_MODE }}
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          FOCUS="${{ github.event.inputs.focus || '' }}"
          MAX_FILES="${{ github.event.inputs.max_files || '3' }}"
          python3 scripts/refactor_agent.py run \
            --config .github/build-fix-agent.json \
            --dry-run "$DRY_RUN" \
            --focus "$FOCUS" \
            --max-files "$MAX_FILES"

      - name: Upload build fix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-fix-agent-report
          path: |
            build/build-fix-agent/report.md
            build/build-fix-agent/proposed.patch
            build/build-fix-agent/prompt.txt
            build/build-fix-agent/diagnostic.log
          if-no-files-found: ignore

      - name: Create build fix PR
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: build-fix-agent/cam360-build-failure
          delete-branch: true
          commit-message: "fix: apply build fix agent patch"
          title: "Fix: build fix agent patch"
          body-path: build/build-fix-agent/report.md
          labels: |
            automated-build-fix
            needs-review
