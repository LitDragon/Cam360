name: Docs Alignment Agent

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Review docs and report only"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      focus:
        description: "Optional docs focus"
        required: false
        default: ""
      max_files:
        description: "Maximum docs files the agent may edit"
        required: true
        default: "4"
  push:
    branches: [main, master]
    paths:
      - "Cam360/**"
      - "Cam360Tests/**"
      - "README.md"
      - "docs/**"
  schedule:
    - cron: "30 18 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-alignment:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run docs alignment agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_MODE: ${{ vars.OPENAI_API_MODE }}
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          FOCUS="${{ github.event.inputs.focus || '' }}"
          MAX_FILES="${{ github.event.inputs.max_files || '4' }}"
          python3 scripts/refactor_agent.py run \
            --config .github/docs-agent.json \
            --dry-run "$DRY_RUN" \
            --focus "$FOCUS" \
            --max-files "$MAX_FILES"

      - name: Upload docs alignment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-agent-report
          path: |
            build/docs-agent/report.md
            build/docs-agent/proposed.patch
            build/docs-agent/prompt.txt
          if-no-files-found: ignore

      - name: Create docs alignment PR
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs-agent/cam360-docs-alignment
          delete-branch: true
          commit-message: "docs: align docs with code"
          title: "Docs: align docs with code"
          body-path: build/docs-agent/report.md
          labels: |
            automated-docs
            needs-review
