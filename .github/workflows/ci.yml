name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AI harness scripts
        run: |
          python3 -m py_compile scripts/*.py
          ./scripts/context.sh >/tmp/cam360-context.md
          python3 scripts/api_validator.py --format text --check-hallucinations >/tmp/cam360-api.txt
          python3 scripts/dependency_checker.py --format text --check-circular >/tmp/cam360-deps.txt
          python3 scripts/knowledge_graph.py --format text >/tmp/cam360-graph.txt
          python3 scripts/impact_analyzer.py --action unstaged --format text >/tmp/cam360-impact.txt
          python3 scripts/task_manager.py --action parse --format text >/tmp/cam360-tasks.txt
          python3 scripts/test_coverage_checker.py --format text >/tmp/cam360-tests.txt
          python3 scripts/prompt_validator.py --format text >/tmp/cam360-prompts.txt
          python3 scripts/session_verifier.py --scope unstaged --plan-only --format text >/tmp/cam360-session.txt

      - name: List available simulators
        run: xcrun simctl list devices available | head -30

      - name: Resolve simulator destination
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          echo "SIMULATOR_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild -project Cam360.xcodeproj \
            -scheme Cam360 \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          mkdir -p build
          rm -rf build/ci-test-results.xcresult
          xcodebuild -project Cam360.xcodeproj \
            -scheme Cam360 \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -enableCodeCoverage YES \
            -resultBundlePath build/ci-test-results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Check code coverage
        run: |
          python3 scripts/test_coverage_checker.py \
            --xcresult build/ci-test-results.xcresult \
            --format text \
            --check-coverage \
            --min-line-coverage 1
